services:
  # ── PostgreSQL Database ──────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: tnja_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set in .env}
    # Loopback only: reachable from the host (e.g. SSH tunnel), never from the internet.
    # Docker bypasses ufw, so the 127.0.0.1 prefix is what keeps this private.
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - tnja_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backend API ──────────────────────────────
  backend:
    build: .
    container_name: tnja_backend
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 9000
      # Inside the compose network the DB host is "postgres", not localhost
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      DIRECT_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
    # Loopback only: Nginx on the host proxies public HTTPS traffic to this port.
    ports:
      - '127.0.0.1:9000:9000'
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:9000/api/health || exit 1']
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

volumes:
  tnja_pgdata:
    driver: local
